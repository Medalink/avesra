[workspace]
members = ["crates/avesra-contracts", "crates/avesra-core", "crates/avesra-server", "crates/avesra-windows", "apps/desktop/src-tauri"]
default-members = ["crates/avesra-contracts", "crates/avesra-core", "crates/avesra-server", "crates/avesra-windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
avesra-contracts = { path = "crates/avesra-contracts" }
avesra-core = { path = "crates/avesra-core" }
avesra-windows = { path = "crates/avesra-windows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
