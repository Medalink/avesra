[package]
name = "avesra-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon"] }
avesra-contracts.workspace = true
avesra-core.workspace = true
avesra-windows.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
sha2 = "0.10.9"
hex = "0.4.3"
base64 = "0.22.1"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", features = ["sink"] }
[lints]
workspace = true
